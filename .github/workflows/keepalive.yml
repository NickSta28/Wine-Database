# Hält das kostenlose Supabase-Projekt wach (Pausierung nach 7 Tagen ohne Zugriff).
name: Supabase wach halten
on:
  schedule:
    - cron: '23 6 * * 1,4'   # montags und donnerstags, 06:23 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'apikey: sb_publishable_Q_rjpu3T_T2v6a5dIHMwJA_D9iHMhW6' \
            'https://smielxactcytntrezlbj.supabase.co/rest/v1/producers?select=id&limit=1')
          echo "HTTP $code"
          test "$code" = "200"
